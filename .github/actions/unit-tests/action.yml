name: Unit tests
description: >-
  Set up .NET and run the slopsoil test suite with its coverage gate. Thin GitHub
  wrapper around ci/test.sh so the same invocation works locally and in CI.

runs:
  using: composite
  steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Install native dependencies
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libsodium23 libopus0 ffmpeg

    - name: Run tests with coverage gate
      shell: bash
      run: "${GITHUB_WORKSPACE}/ci/test.sh"

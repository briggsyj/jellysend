name: Publish Docker image

on:
  pull_request:
    # opened/synchronize/reopened → build-only check (nothing pushed).
    # closed → gated to merged-only below; publishes "latest".
    types: [opened, synchronize, reopened, closed]
    branches: [develop]     # PRs whose base branch is develop
  push:
    tags: ["v*.*.*"]        # publishes versioned (1.2.3 / 1.2 / 1) tags
    # .NET edition preview: every push publishes :dotnet / :dotnet-sha-<sha>
    # (publish-dotnet only — the Python jobs skip branch pushes).
    branches: [001-dotnet-rewrite]
  workflow_dispatch:        # allow manual builds

# Only one publish run per ref at a time; cancel superseded runs to save minutes.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR derives its repo from the GitHub repository and authenticates with the
  # built-in GITHUB_TOKEN, so forks publish to their own ghcr.io/<owner>/<repo>
  # with no extra setup. Docker Hub is optional: it is only used when the
  # DOCKERHUB_USERNAME repo variable (and DOCKERHUB_TOKEN secret) are set.
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
  # The image relies on VA-API / NVENC hardware H.264 paths, which are x86-only.
  PLATFORMS: linux/amd64

jobs:
  # PR check: make sure the image still builds. Nothing is pushed.
  build-check:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: false
          # Read-only: PR checks must not race the publish job for cache slots.
          cache-from: type=gha

  # PR check for the .NET edition image (specs/001-dotnet-rewrite T006): builds
  # libdave + the self-contained host. Build-only; publish-dotnet pushes it.
  build-check-dotnet:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Skip unless the .NET edition exists on this branch
        id: has
        run: |
          if [ -f dotnet/Dockerfile ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; fi

      - name: Set up Docker Buildx
        if: steps.has.outputs.yes == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build .NET image (no push)
        if: steps.has.outputs.yes == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dotnet/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: false
          cache-from: type=gha,scope=dotnet
          cache-to: type=gha,scope=dotnet,mode=max,ignore-error=true

  # Run the unit tests against the exact commit being published. The publish job
  # below gates on this, so a failing suite blocks the image from being pushed.
  # A closed-but-unmerged PR must never publish, so gate on merged == true.
  test:
    if: (github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref_type == 'branch')) || (github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run unit tests
        uses: ./.github/actions/unit-tests

  publish:
    needs: test             # only publish if the tests passed
    if: (github.event_name != 'pull_request' && !(github.event_name == 'push' && github.ref_type == 'branch')) || (github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    # On a merged PR the triggering ref is the PR merge ref, not develop. Resolve
    # the branch/commit we actually want to build and tag; for pushes/dispatch
    # these fall through to the triggering ref.
    env:
      TARGET_REF_TYPE: ${{ github.event_name == 'pull_request' && 'branch' || github.ref_type }}
      TARGET_REF_NAME: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref_name }}
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

    permissions:
      contents: read        # checkout
      packages: write       # push to GHCR
      id-token: write       # mint OIDC token for keyless provenance
      attestations: write   # attach the provenance attestation

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Resolve image repositories
        id: images
        shell: bash
        run: |
          # Registry paths must be lowercase; GitHub owners may not be.
          ghcr="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "list<<EOF"
            echo "${ghcr}"
            if [[ -n "${DOCKERHUB_USERNAME}" ]]; then
              echo "docker.io/${DOCKERHUB_USERNAME,,}/slopsoil"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Compute image tags and labels
        id: meta
        uses: ./.github/actions/docker-meta
        with:
          default-branch: develop
          ref-type: ${{ env.TARGET_REF_TYPE }}
          ref-name: ${{ env.TARGET_REF_NAME }}
          sha: ${{ env.TARGET_SHA }}
          images: ${{ steps.images.outputs.list }}
          title: slopsoil
          description: >-
            Discord self-bot that streams live TV, IPTV, YouTube, Jellyfin and
            HLS/RTSP sources into a Discord voice channel.
          licenses: GPL-3.0-or-later

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers across runs via the GitHub Actions cache backend.
          cache-from: type=gha
          # A cache write failure ("failed to reserve cache") must not fail the
          # publish — the image itself was built fine.
          cache-to: type=gha,mode=max,ignore-error=true
          # Supply-chain metadata: SLSA provenance + SBOM attached to the image.
          provenance: mode=max
          sbom: true

  # .NET edition image (specs/001-dotnet-rewrite T039), published side by side
  # with the Python image until cut-over: :dotnet (moving) and
  # :dotnet-sha-<short sha> (pinned). Never touches :latest. Runs on pushes to
  # the rewrite branch, merged PRs into develop, and manual dispatch; skipped
  # on refs without dotnet/. Gated on the .NET test suite.
  publish-dotnet:
    if: github.event_name != 'pull_request' || (github.event.action == 'closed' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}

      - name: Skip unless the .NET edition exists on this ref
        id: has
        run: |
          if [ -f dotnet/Dockerfile ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; fi

      - name: Set up .NET
        if: steps.has.outputs.yes == 'true'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: dotnet/global.json

      - name: Run .NET tests with coverage gate
        if: steps.has.outputs.yes == 'true'
        working-directory: dotnet
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libsodium23 libopus0
          ci/test.sh

      - name: Compute .NET image tags
        if: steps.has.outputs.yes == 'true'
        id: tags
        shell: bash
        run: |
          short="${TARGET_SHA::7}"
          repos=("ghcr.io/${GITHUB_REPOSITORY,,}")
          if [[ -n "${DOCKERHUB_USERNAME}" ]]; then
            repos+=("docker.io/${DOCKERHUB_USERNAME,,}/slopsoil")
          fi
          {
            echo "list<<EOF"
            for r in "${repos[@]}"; do
              echo "${r}:dotnet"
              echo "${r}:dotnet-sha-${short}"
            done
            echo "EOF"
            echo "images<<EOF"
            printf '%s\n' "${repos[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      # Reused for OCI labels only; its tags (latest/sha-*) belong to the Python image.
      - name: Compute image labels
        if: steps.has.outputs.yes == 'true'
        id: meta
        uses: ./.github/actions/docker-meta
        with:
          default-branch: develop
          sha: ${{ env.TARGET_SHA }}
          images: ${{ steps.tags.outputs.images }}
          title: slopsoil (.NET edition)
          description: >-
            Discord self-bot that streams Jellyfin into a Discord voice channel
            (.NET edition preview).
          licenses: GPL-3.0-or-later

      - name: Set up Docker Buildx
        if: steps.has.outputs.yes == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.has.outputs.yes == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.has.outputs.yes == 'true' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push .NET image
        if: steps.has.outputs.yes == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: dotnet/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dotnet
          cache-to: type=gha,scope=dotnet,mode=max,ignore-error=true
          provenance: mode=max
          sbom: true

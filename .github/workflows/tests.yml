name: Tests

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

# Cancel superseded runs for the same branch/PR to save minutes.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run unit tests
        uses: ./.github/actions/unit-tests
